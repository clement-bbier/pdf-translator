[project]
name = "pdf-translator"
version = "0.1.0"
description = "Layout-preserving PDF translation (CJK to French/English) with an LLM."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI declares parameters with File(...)/Form(...) defaults.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test modules put the repo root on sys.path before importing the app.
"tests/*" = ["E402"]
